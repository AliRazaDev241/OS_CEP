name: Build protocol PDF in Times New Roman
on:
  push:
    branches: [shared/align-slr-protocol-twelve-items]
    paths:
      - report/main.tex
      - .github/workflows/protocol-pdf.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Require Times New Roman
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:WINDIR\Fonts\times.ttf")) { throw 'Times New Roman is unavailable on this runner' }
          if (-not (Test-Path "$env:WINDIR\Fonts\timesbd.ttf")) { throw 'Times New Roman Bold is unavailable on this runner' }
      - name: Install MiKTeX
        shell: pwsh
        run: |
          choco install miktex -y --no-progress
          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
          refreshenv
          initexmf '--set-config-value=[MPM]AutoInstall=1'
          xelatex --version
      - name: Compile and check
        shell: pwsh
        run: |
          xelatex -interaction=nonstopmode -halt-on-error -output-directory=report report/main.tex
          xelatex -interaction=nonstopmode -halt-on-error -output-directory=report report/main.tex
          python -m pip install --quiet pymupdf
          @'
          import fitz
          doc = fitz.open('report/main.pdf')
          names = {font[3] for page in doc for font in page.get_fonts(full=True)}
          print('Embedded PDF fonts:', sorted(names))
          assert len(doc) >= 1
          assert any('TimesNewRoman' in name.replace('-', '').replace(' ', '') for name in names), names
          assert not any('Nimbus' in name or 'LMRoman' in name for name in names), names
          text = ''.join(page.get_text() for page in doc)
          for heading in ('1. Research objective', '2. Research questions', '3. Selected academic databases', '4. Search keywords', '5. Search strings', '6. Publication period', '7. Inclusion criteria', '8. Exclusion criteria', '9. Screening procedure', '10. Quality-assessment criteria', '11. Data-extraction fields', '12. Evidence-synthesis strategy'):
              assert heading in text, heading
          for roll in ('SE-24071', 'SE-24094', 'SE-24302'):
              assert roll in text, roll
          '@ | python -
      - name: Commit compiled PDF to this PR branch
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add report/main.pdf
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'Build professor protocol PDF with Times New Roman'
            git fetch origin shared/align-slr-protocol-twelve-items
            git rebase origin/shared/align-slr-protocol-twelve-items
            git push origin HEAD:refs/heads/shared/align-slr-protocol-twelve-items
          }
